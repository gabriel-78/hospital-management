apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospital-core
spec:
  replicas: 1
  selector:
    matchLabels: { app: hospital-core }
  template:
    metadata:
      labels: { app: hospital-core }
    spec:
      containers:
        - name: hospital-core
          image: hospital-core:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3333 }]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: app-secrets, key: HOSPITAL_DATABASE_URL } }
            - name: REDIS_URL
              valueFrom: { configMapKeyRef: { name: app-config, key: REDIS_URL } }
            - { name: PHARMA_SERVICE_URL, value: http://pharma-service:5001 }
            - { name: FRONT_END_URL, value: http://localhost:5173 }
            - { name: PORT, value: "3333" }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 3333 }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: 3333 }
            initialDelaySeconds: 15
            periodSeconds: 20
          startupProbe:
            tcpSocket: { port: 3333 }
            periodSeconds: 2
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: hospital-core
spec:
  selector: { app: hospital-core }
  ports: [{ port: 3333, targetPort: 3333 }]
