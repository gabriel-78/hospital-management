apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharma-service
spec:
  replicas: 1
  selector:
    matchLabels: { app: pharma-service }
  template:
    metadata:
      labels: { app: pharma-service }
    spec:
      containers:
        - name: pharma-service
          image: pharma-service:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 5001 }]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: app-secrets, key: PHARMA_DATABASE_URL } }
            - { name: FRONT_END_URL, value: http://localhost:5173 }
            - { name: PORT, value: "5001" }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 5001 }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: 5001 }
            initialDelaySeconds: 15
            periodSeconds: 20
          startupProbe:
            tcpSocket: { port: 5001 }
            periodSeconds: 2
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: pharma-service
spec:
  selector: { app: pharma-service }
  ports: [{ port: 5001, targetPort: 5001 }]
