        - name: wait-for-db
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h pharma-postgres -p 5432 -U admin; do sleep 2; done"]
      containers:
        - name: migrate
          image: pharma-migrate:local
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: app-secrets, key: PHARMA_DATABASE_URL } }
          command: ["sh", "-c", "pnpm --filter pharma-service exec prisma migrate deploy && pnpm --filter pharma-service exec prisma db seed"]
