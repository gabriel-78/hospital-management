# ---------- hospital-postgres ----------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hospital-postgres
spec:
  serviceName: hospital-postgres
  replicas: 1
  selector:
    matchLabels: { app: hospital-postgres }
  template:
    metadata:
      labels: { app: hospital-postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, value: admin }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD } }
            - { name: POSTGRES_DB, value: hospital-management }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "admin"] }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: hospital-postgres
spec:
  clusterIP: None
  selector: { app: hospital-postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
