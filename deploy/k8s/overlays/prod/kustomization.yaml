apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hospital-management
resources:
  - namespace.yaml
  - ../../base
  - app-secret.yaml
  - app-config.yaml
patches:
  - path: replicas-patch.yaml
images:
  - name: hospital-core
    newName: registry.example.com/hospital-core
    newTag: "1.0.0"
  - name: pharma-service
    newName: registry.example.com/pharma-service
    newTag: "1.0.0"
